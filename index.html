<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7fb" />
    <!-- Light is the default theme. Apply it (or a saved dark preference)
         before first paint so the site never flashes the wrong theme. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('skyweb-theme');
          if (saved === 'dark') theme = 'dark';
        } catch (e) { /* private mode — fall back to the default (light) */ }
        if (theme === 'light') document.documentElement.classList.add('light');
      })();
    </script>
    <meta name="description" content="SkyWeb – UI/UX, AI Automation, AI Agents, SEO & Chatbots for modern businesses." />
    <meta name="facebook-domain-verification" content="37jkyls1dscm8qg5ozk4nmyw1j6p29" />
    <link rel="canonical" href="https://www.theskyweb.com/" />
    <title>SkyWeb – Digital Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Dograh Widget (headless — no UI, driven from DentalDemo.jsx via window.DograhWidget) -->
    <script>
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = 'https://app.dograh.com/embed/dograh-widget.js?token=emb_W8a7Eo7h7WrUmqmzkRz5gSM2QpSa1YiEOIqrtOW6QR4&environment=production&apiEndpoint=https://api.dograh.com';
        js.setAttribute('data-dograh-context', JSON.stringify({
          page_url: window.location.href,
          today: new Date().toISOString().slice(0, 10)
        }));
        js.async = true;
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'dograh-widget'));
    </script>
  </body>
</html>
